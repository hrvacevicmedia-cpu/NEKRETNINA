name: Build walkthrough video

on:
  push:
    paths:
      - "assets/clips-manifest.txt"
      - ".github/workflows/build-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download clips
        run: |
          set -euo pipefail
          mkdir -p assets/clips work
          i=0
          while read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            echo "Fetching clip $i: $url"
            curl -fSL --retry 3 -o "work/clip$i.mp4" "$url"
          done < assets/clips-manifest.txt
          ls -la work/

      - name: Concatenate and encode scrub-friendly video
        run: |
          set -euo pipefail
          # Normalize every clip to identical stream parameters before concat
          n=0
          for f in work/clip*.mp4; do
            n=$((n+1))
            ffmpeg -y -i "$f" -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=25,format=yuv420p" \
              -an -c:v libx264 -preset medium -crf 18 "work/norm$n.mp4"
          done
          for f in work/norm*.mp4; do echo "file '$PWD/$f'"; done > work/list.txt
          # Full-quality master
          ffmpeg -y -f concat -safe 0 -i work/list.txt -c:v libx264 -preset slow -crf 20 \
            -pix_fmt yuv420p -movflags +faststart -an assets/clips/walkthrough-master.mp4
          # Scrub-friendly web version: dense keyframes (one every 4 frames) for smooth scroll seeking
          ffmpeg -y -i assets/clips/walkthrough-master.mp4 -c:v libx264 -preset slow -crf 23 \
            -g 4 -keyint_min 4 -sc_threshold 0 -pix_fmt yuv420p -movflags +faststart -an assets/walkthrough.mp4
          # Poster frame
          ffmpeg -y -i assets/walkthrough.mp4 -frames:v 1 -q:v 3 assets/poster.jpg
          ls -la assets/ assets/clips/

      - name: Keep individual clips too
        run: |
          i=0
          while read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            cp "work/clip$i.mp4" "assets/clips/transition-$i.mp4"
          done < assets/clips-manifest.txt

      - name: Commit video assets
        run: |
          git config user.name "asset-fetch-bot"
          git config user.email "actions@github.com"
          git add assets/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: build scroll-scrub walkthrough video from generated clips"
          git push
